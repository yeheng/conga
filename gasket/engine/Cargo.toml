[package]
name = "gasket-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Core execution engine for gasket"

[dependencies]
gasket-types = { path = "../types" }
gasket-channels = { path = "../channels" }
gasket-storage = { path = "../storage" }
gasket-providers = { path = "../providers" }
gasket-sandbox = { path = "../sandbox" }
# Vault crypto dependencies (migrated from gasket-vault crate)
chacha20poly1305 = "0.10"
argon2 = { version = "0.5", features = ["std"] }
rand = "0.8"
zeroize = { version = "1.7", features = ["zeroize_derive"] }
gasket-embedding = { path = "../embedding", optional = true }
tokio.workspace = true
tokio-util.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
dashmap = "6"
tiktoken-rs.workspace = true
parking_lot = "0.12"

which = "8.0"
dom_smoothie = "0.17"
dom_query = "0.27"
fast_html2md = "0.0.62"
regex = "1"
bytes = "1"
cron.workspace = true
chrono.workspace = true
uuid.workspace = true
url.workspace = true
urlencoding = "2.1"
serde_yaml.workspace = true
json5 = "1.3"
base64 = "0.22"
futures-util.workspace = true
tokio-stream = "0.1.18"
reqwest.workspace = true
dirs.workspace = true
unicode-segmentation = "1"

[features]
default = []
smart-model-selection = []
provider-anthropic = ["gasket-providers/provider-anthropic"]
provider-gemini = ["gasket-providers/provider-gemini"]
provider-copilot = ["gasket-providers/provider-copilot"]
provider-minimax = ["gasket-providers/provider-minimax"]
provider-moonshot = ["gasket-providers/provider-moonshot"]
all-providers = ["gasket-providers/all-providers"]
embedding = ["gasket-embedding"]

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"
