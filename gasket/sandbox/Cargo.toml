[package]
name = "gasket-sandbox"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords = ["sandbox", "security", "isolation"]
description = "Secure sandbox execution module for gasket with multi-platform support"

[features]
default = ["platform-native", "audit"]

# Platform-native sandbox (bwrap, sandbox-exec, fallback)
platform-native = []

# Audit logging
audit = []

# Full feature set
full = ["platform-native", "audit"]

[dependencies]
# Async runtime
tokio = { workspace = true }
async-trait = { workspace = true }
futures-util = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Logging
tracing = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Time
chrono = { workspace = true }

# UUID
uuid = { workspace = true, features = ["v4", "serde"] }

# Configuration
dirs = { workspace = true }

# Concurrent data structures
dashmap = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"
serde_yaml.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# Linux-specific dependencies

[target.'cfg(target_os = "macos")'.dependencies]
# macOS-specific dependencies

[target.'cfg(target_os = "windows")'.dependencies]
winapi = { version = "0.3", features = ["jobapi2", "processthreadsapi", "handleapi", "winnt", "winbase", "minwindef", "ntdef", "tlhelp32"] }
