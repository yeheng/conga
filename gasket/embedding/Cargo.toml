[package]
name = "gasket-embedding"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Embedding-based semantic search for gasket history recall"

[features]
default = []
local-onnx = ["fastembed"]

[dependencies]
tokio.workspace = true
tokio-util.workspace = true
async-trait.workspace = true
anyhow.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
parking_lot = "0.12"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
reqwest = { workspace = true }
tiktoken-rs.workspace = true
futures = "0.3"
gasket-types = { path = "../types" }
gasket-storage = { path = "../storage" }
fastembed = { version = "5", optional = true }
lancedb = "0.27"
arrow-array = "57"
arrow-schema = "57"
dirs = "5"
rig-core = { version = "0.36.0", default-features = false, features = ["reqwest", "rustls"] }

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"
mockito = "1"
serde_yaml = "0.9"
# RecallSearcher integration tests build a SQLite-backed EventStore for content
# lookups. sqlx stays a dev-only dependency here; it is removed entirely in the
# Phase 3 cleanup once EventStore no longer uses SQLite.
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "json"] }
