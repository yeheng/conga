[package]
name = "conga"
version = "1.0.0"
description = "Conga desktop application"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-notification = "2"
tokio = { version = "1", features = ["rt", "sync", "time"] }
dashmap = "6"
conga = { path = "../../conga/conga" }
conga-host = { path = "../../conga/conga-host", features = ["session-index"] }
conga-ext = { path = "../../conga/conga-ext", features = ["terminal", "rag"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "ansi", "std", "env-filter"] }
dotenvy = "0.15.7"

[dev-dependencies]
# Tests move $HOME into a temp dir so the whole `~/.conga` config root is
# isolated from the developer's real one.
tempfile = "3"
# `macros` for #[tokio::test]; the runtime features come from the normal dep.
tokio = { version = "1", features = ["macros"] }
